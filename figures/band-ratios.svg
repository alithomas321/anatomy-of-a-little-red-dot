  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #203244" transform="translate(8.263125 312.616617)">Dots: ratio at measured means. Thick bars: 16–84% interval from supplied extraction errors.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #203244" transform="translate(8.263125 323.419078)">Thin gray: 95% Fieller interval. Thin blue below each row: 95% with archive rescaled errors.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #203244" transform="translate(8.263125 334.221539)">Dashed line: equal brightness. These intervals still assume independent errors; calibration and</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #203244" transform="translate(8.263125 345.024)">extraction uncertainty are incomplete. See uncertainty-assumptions for unbounded cases.</text>
  </g>
